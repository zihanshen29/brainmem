name: checks
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - name: mypy
        # Surface type errors as annotations so they are readable without the raw log.
        run: |
          python -m pip list --format=freeze | grep -iE '^(mypy|pydantic|typer|gitpython|portalocker|openai|anthropic|mcp)=='
          if ! mypy src > mypy.txt 2>&1; then
            cat mypy.txt
            sed -nE 's/^([^:]+):([0-9]+): error: (.*)$/::error file=\1,line=\2::\3/p' mypy.txt
            exit 1
          fi
      - name: pytest
        # One annotation lists the failing tests so they are readable without the raw log.
        run: |
          if ! pytest -p no:cacheprovider -q -rfE > pytest.txt 2>&1; then
            tail -n 300 pytest.txt
            summary=$(grep -E '^(FAILED|ERROR) ' pytest.txt | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest failures::${summary}"
            exit 1
          fi
        env:
          PYTHONPATH: tests/offline
          GIT_CONFIG_GLOBAL: /dev/null
