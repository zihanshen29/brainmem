[project]
name = "brain"
version = "0.2.0"
description = "Personal memory system with markdown wiki + SQLite backbone"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "mcp>=1.2.0",
    "anthropic>=0.40.0",
    "openai>=1.66.0",
    "python-frontmatter>=1.1.0",
    "python-ulid>=2.2.0",
    "rich>=13.7.0",
    "tomli-w>=1.0.0",
    "GitPython>=3.1.40",
    "platformdirs>=4.2.0",
    "sqlite-vec>=0.1.6",
    "tiktoken>=0.7.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "pypdf>=4.3.0",
]

[project.scripts]
mem = "brain.cli.main:app"
mem-mcp = "brain.mcp.server:main"
mem-mcp-http = "brain.mcp.server_http:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"brain.db" = ["migrations/*.sql"]

[tool.setuptools.data-files]
"share/brainmem/skills/brainmem" = ["skills/brainmem/SKILL.md"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
